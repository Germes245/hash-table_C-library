name: CI  # имя workflow, будет отображаться на GitHub

# Триггеры: когда запускать автоматически
on:
  push:
    branches: [ main, master ]   # при пуше в главную ветку
  pull_request:
    branches: [ main, master ]   # при создании PR (если будете использовать)

# Список задач (jobs), они могут выполняться параллельно
jobs:
  # Первая задача: сборка и тестирование на Ubuntu (Linux)
  build-linux:
    runs-on: ubuntu-latest       # окружение: последняя версия Ubuntu
    steps:
      - name: Checkout code      # 1. Скачать ваш код из репозитория
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Compile
        run: cmake . & cmake --build .

      - name: Run tests (if any)
        run: |
          # Если у вас есть тестовая программа, запустите её
          # Например, ./hashtest
          # Или просто проверьте, что сборка прошла:
          echo "Build completed successfully"

  # Вторая задача: сборка на Windows (через MinGW)
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW (optional, usually already present)
        run: choco install mingw -y   # устанавливает MinGW через chocolatey

      - name: Compile
        run: |
          gcc -Iinclude src/*.c -o hashtest.exe

      - name: Run test (optional)
        run: ./hashtest.exe

  # Третья задача: проверка на утечки памяти через Valgrind (очень полезно для C)
  memory-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Build with debug symbols
        run: gcc -g -Iinclude src/*.c -o hashtest_debug
      - name: Run valgrind
        run: valgrind --leak-check=full --error-exitcode=1 ./hashtest_debug